<body><div><div class="l">💌</div><small id="m">…</small></div><script>
const API="https://zupzvekirthvknydjjga.supabase.co/functions/v1/greenbooks";
const k=((new URLSearchParams(location.search).get("k"))||location.hash.slice(1)).toLowerCase().replace(/[^a-z0-9]/g,"");
